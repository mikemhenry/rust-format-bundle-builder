name: Build rust-format bundle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git patch xz-utils

      - name: Build and validate bundle
        run: ./scripts/build-bundle.sh

      - name: Show bundle metadata
        run: |
          cat dist/rust-format-tools.tar.xz.sha256
          ls -lh dist/rust-format-tools.tar.xz

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/rust-format-tools.tar.xz
          archive: false
          if-no-files-found: error

      - name: Upload checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/rust-format-tools.tar.xz.sha256
          archive: false
          if-no-files-found: error
